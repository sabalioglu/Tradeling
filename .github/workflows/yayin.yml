# Sayfayı GitHub Pages'e yayınlar. Veri çek ve Sabah bülteni bitince, ayrıca main'e yapılan
# her push'ta çalışır. (GITHUB_TOKEN ile yapılan push'lar başka iş akışını tetiklemediği için
# veri iş akışlarının bitişi ayrıca dinleniyor.)
# Pages ayarlarında kaynak "GitHub Actions" seçilmemişse yayın adımı atlanır.
name: Yayın

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Veri çek", "Sabah bülteni"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - name: Pages ayarı
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo yok)
          echo "Pages kaynağı: $tip"
          if [ "$tip" != "workflow" ]; then
            echo "::notice::GitHub Pages kaynağı 'GitHub Actions' değil ($tip); yayın atlandı. Settings → Pages → Source: GitHub Actions."
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.pages.outputs.hazir == 'true'
        with:
          ref: main
      - name: Yayın klasörü
        if: steps.pages.outputs.hazir == 'true'
        run: mkdir _site && cp index.html app.js tazelik.js data.js _site/
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.hazir == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.hazir == 'true'
        with:
          path: _site
      - id: dagit
        if: steps.pages.outputs.hazir == 'true'
        uses: actions/deploy-pages@v4
